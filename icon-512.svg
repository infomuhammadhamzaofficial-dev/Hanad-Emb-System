<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Emerald Brand Gradient -->
    <linearGradient id="embGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Royal Zari / Golden Thread Gradient -->
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Craft Depth -->
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#022c22" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#embGrad512)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="5" />

  <!-- Hand Embroidery Hoop (Tambour / Adda Frame) -->
  <g filter="url(#shadow512)">
    <!-- Stretched Fabric Canvas inside Hoop -->
    <circle cx="256" cy="277" r="138" fill="#022c22" fill-opacity="0.45" />

    <!-- Outer Golden / Wooden Hoop Ring -->
    <circle cx="256" cy="277" r="138" fill="none" stroke="url(#goldGrad512)" stroke-width="20" />
    <circle cx="256" cy="277" r="126" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4" />

    <!-- Hoop Tension Screw Bracket at Top -->
    <rect x="226" y="112" width="60" height="30" rx="7" fill="#f59e0b" stroke="#b45309" stroke-width="4" />
    <line x1="208" y1="127" x2="304" y2="127" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Delicate Running Embroidery Stitches on Fabric -->
    <path d="M173 282 Q256 368 339 282" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-dasharray="18 13" stroke-linecap="round" />

    <!-- Silk / Zari Golden Thread Looping from Needle -->
    <path d="M350 184 C410 117 458 187 405 245 C336 315 224 256 187 336 C160 384 213 427 272 410" fill="none" stroke="url(#goldGrad512)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diagonal Hand Embroidery Needle (Aari / Sooi) -->
    <path d="M376 157 L160 373" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <!-- Needle Eye -->
    <ellipse cx="355" cy="179" rx="7" ry="15" transform="rotate(-45 355 179)" fill="#064e3b" />

    <!-- Sparkling Sitara / Sequins Star (Embellishment) -->
    <path d="M176 180 Q176 202 198 202 Q176 202 176 224 Q176 202 154 202 Q176 202 176 180 Z" fill="#fef08a" />
    <circle cx="176" cy="202" r="4" fill="#ffffff" />

    <!-- Secondary Micro Sparkle -->
    <path d="M333 340 Q333 352 345 352 Q333 352 333 364 Q333 352 321 352 Q333 352 333 340 Z" fill="#fef08a" />
  </g>
</svg>
