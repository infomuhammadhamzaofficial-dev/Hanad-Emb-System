<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Vibrant Emerald Brand Gradient -->
    <linearGradient id="embGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Royal Zari / Golden Thread Gradient -->
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Craft Depth -->
    <filter id="shadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#022c22" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="192" height="192" rx="44" fill="url(#embGrad192)" />
  <rect x="4" y="4" width="184" height="184" rx="40" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" />

  <!-- Hand Embroidery Hoop (Tambour / Adda Frame) -->
  <g filter="url(#shadow192)">
    <!-- Stretched Fabric Canvas inside Hoop -->
    <circle cx="96" cy="104" r="52" fill="#022c22" fill-opacity="0.45" />

    <!-- Outer Golden / Wooden Hoop Ring -->
    <circle cx="96" cy="104" r="52" fill="none" stroke="url(#goldGrad192)" stroke-width="7.5" />
    <circle cx="96" cy="104" r="47.5" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" />

    <!-- Hoop Tension Screw Bracket at Top -->
    <rect x="85" y="42" width="22" height="11" rx="2.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <line x1="78" y1="47.5" x2="114" y2="47.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Delicate Running Embroidery Stitches on Fabric -->
    <path d="M65 106 Q96 138 127 106" fill="none" stroke="#a7f3d0" stroke-width="4.5" stroke-dasharray="7 5" stroke-linecap="round" />

    <!-- Silk / Zari Golden Thread Looping from Needle -->
    <path d="M131 69 C154 44 172 70 152 92 C126 118 84 96 70 126 C60 144 80 160 102 154" fill="none" stroke="url(#goldGrad192)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diagonal Hand Embroidery Needle (Aari / Sooi) -->
    <path d="M141 59 L60 140" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />
    <!-- Needle Eye -->
    <ellipse cx="133" cy="67" rx="2.5" ry="5.5" transform="rotate(-45 133 67)" fill="#064e3b" />

    <!-- Sparkling Sitara / Sequins Star (Embellishment) -->
    <path d="M66 68 Q66 76 74 76 Q66 76 66 84 Q66 76 58 76 Q66 76 66 68 Z" fill="#fef08a" />
    <circle cx="66" cy="76" r="1.5" fill="#ffffff" />

    <!-- Secondary Micro Sparkle -->
    <path d="M125 132 Q125 137 130 137 Q125 137 125 142 Q125 137 120 137 Q125 137 125 132 Z" fill="#fef08a" />
  </g>
</svg>
